<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión — Esgode CRM</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/esgode/tokens.css">
<link rel="stylesheet" href="ds/esgode/components/bundle.css">
<script src="ds/esgode/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent-text)}a:hover{color:var(--accent-text)}
</style>
</helmet>
<div class="es-root" data-theme="{{ theme }}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding: 72px 24px 32px;">

  <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 40px;">
    <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px;">
      <div style="display: flex; align-items: baseline; font-family: var(--font-display); font-size: 40px; line-height: 44px; font-weight: 700; letter-spacing: -0.6px; color: var(--ink);" role="img" aria-label="esgode">
        <span>es</span>
        <img src="{{ logoSrc }}" alt="" style="width: 54px; height: 54px; align-self: center; margin: 0 2px; transform: translateY(12px);">
        <span>ode</span>
      </div>
      <div style="font-family: var(--font-display); font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 1.5px; color: var(--ink-secondary);">tech store</div>
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px; color: var(--ink);">Ingresa a tu cuenta</h1>
    <p style="margin: 0; font-size: 15px; line-height: 20px; color: var(--ink-secondary);">Usa el usuario que te asignó administración.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px;" onSubmit="{{ enter }}">
    <x-import component-from-global-scope="Esgode.TextField" label="Usuario" placeholder="nombre.apellido" default-value="camila.rojas" type="text" style="max-width: none;"></x-import>
    <x-import component-from-global-scope="Esgode.TextField" label="Contraseña" placeholder="••••••••" type="password" default-value="esgode2026" style="max-width: none;"></x-import>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
      <x-import component-from-global-scope="Esgode.Toggle" label="Recordarme" checked="{{ remember }}" on-change="{{ setRemember }}"></x-import>
      <a href="#recuperar" style="font-size: 13px; line-height: 18px; font-weight: 600; color: var(--accent-text); text-decoration: none;">¿Olvidaste tu contraseña?</a>
    </div>

    <a href="Calculadora.dc.html" class="es-btn es-btn--primary es-btn--lg es-btn--pill" style="margin-top: 16px; text-decoration: none; width: 100%;">Ingresar</a>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--ink-secondary);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span>Tu rol (staff o administrador) se asigna desde el escritorio.</span>
    </div>
    <div style="font-size: 12px; line-height: 16px; color: var(--ink-secondary);">Esgode · Yopal, Casanare</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { remember: true }; }
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      logoSrc: (this.props.theme ?? 'light') === 'dark' ? '/_blob/b9b74230094a72b1b0ab031cad78c8dc' : '/_blob/6083dc97c87dc300922b3bc9e33cdf22',
      remember: this.state.remember,
      setRemember: (v) => this.setState({ remember: v }),
      enter: (e) => { if (e && e.preventDefault) e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
