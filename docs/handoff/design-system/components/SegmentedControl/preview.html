<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--surface); padding: 16px; font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root" class="es-root"></div>
<script>
(function () {
  var E = window.Esgode, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function App() {

    var [v, setV] = React.useState('todos');
    var [p, setP] = React.useState('porpagar');
    return h('div', { className: 'col' },
      h(E.SegmentedControl, { label: 'Filtrar clientes', value: v, onChange: setV, options: [
        { value: 'todos', label: 'Todos', count: 248 }, { value: 'frecuentes', label: 'Frecuentes', count: 36 },
        { value: 'nuevos', label: 'Nuevos', count: 12 }, { value: 'inactivos', label: 'Inactivos' }] }),
      h(E.SegmentedControl, { label: 'Filtrar pedidos', value: p, onChange: setP, options: [
        { value: 'todos', label: 'Todos' }, { value: 'porpagar', label: 'Por pagar', count: 7 }, { value: 'pagados', label: 'Pagados' },
        { value: 'enviados', label: 'Enviados' }, { value: 'entregados', label: 'Entregados' }] }));
  }
  root.render(h(App));
})();
</script>
</body>
</html>
