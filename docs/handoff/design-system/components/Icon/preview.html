<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--surface); padding: 16px; font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root" class="es-root"></div>
<script>
(function () {
  var E = window.Esgode, h = React.createElement;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  function App() {

    var names = ['home','person','cart','chat','box','chart','search','plus','check','chevron','instagram','whatsapp'];
    return h('div', { className: 'row', style: { gap: '20px' } }, names.map(function (n) {
      return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', color: 'var(--ink-secondary)', fontSize: '11px' } },
        h(E.Icon, { name: n, size: 'lg', label: n }), h('span', null, n));
    }));
  }
  root.render(h(App));
})();
</script>
</body>
</html>
